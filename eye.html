<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>themistrinel // ascii ocular entity</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text-main: #c9d1d9;
      --text-dim: #8b949e;
      --text-dark: #484f58;
      --accent: #58a6ff;
      --highlight: #f0f6fc;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --card-bg: #f6f8fa;
      --border: #d0d7de;
      --text-main: #24292f;
      --text-dim: #57606a;
      --text-dark: #8c959f;
      --accent: #0969da;
      --highlight: #1f2328;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .brand a:hover {
      color: var(--accent);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--text-dim);
      font-size: 0.8rem;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }

    .theme-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    main {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      margin: 1.5rem 0;
    }

    .eye-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .svg-container {
      width: 100%;
      filter: drop-shadow(0 8px 30px rgba(0, 0, 0, 0.35));
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Dynamic SVG styling using CSS vars */
    .mono {
      font-family: var(--font-mono);
      white-space: pre;
    }
    .box-rect {
      fill: var(--card-bg);
      stroke: var(--border);
      stroke-width: 1;
    }
    .eye-frame {
      fill: var(--text-dim);
      font-size: 12px;
    }
    .eye-lid {
      fill: var(--text-main);
      font-size: 12px;
    }
    .pupil-iris {
      fill: var(--text-main);
      font-size: 12px;
    }
    .pupil-core {
      fill: var(--accent);
      font-weight: bold;
    }
    .sub-caption {
      font-size: 11px;
      fill: var(--text-dim);
      letter-spacing: 1.5px;
    }
    .status-dot-svg {
      fill: var(--accent);
    }
    .link-hint {
      font-size: 11px;
      fill: var(--accent);
      letter-spacing: 1px;
      font-weight: 600;
    }
    .term-dim {
      fill: var(--text-dark);
    }

    /* Interactive eyelid transitions */
    .lid-top-group {
      transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.08s ease;
      transform: translateY(0);
      opacity: 0;
    }

    .lid-bottom-group {
      transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.08s ease;
      transform: translateY(0);
      opacity: 0;
    }

    .is-blinking .lid-top-group {
      transform: translateY(14px);
      opacity: 1;
    }

    .is-blinking .lid-bottom-group {
      transform: translateY(-14px);
      opacity: 1;
    }

    .animated-breathing {
      animation: subtleBreathing 6.5s ease-in-out infinite;
    }

    @keyframes subtleBreathing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }

    footer {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid var(--border);
      padding-top: 0.9rem;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .instructions {
      font-size: 0.72rem;
      color: var(--text-dark);
      text-align: center;
    }

    @media (prefers-reduced-motion) {
      .animated-breathing {
        animation: none !important;
      }
      .lid-top-group, .lid-bottom-group {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <a href="https://github.com/themistrinel">
        <span>&gt;</span> themistrinel
      </a>
      <span style="color: var(--text-dark);">/</span>
      <span style="color: var(--text-dim);">observer.entity</span>
    </div>

    <div style="display: flex; align-items: center; gap: 1rem;">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="label-state">TRACKING</span>
      </div>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light theme">THEME</button>
    </div>
  </header>

  <main>
    <div class="eye-stage">
      <div class="svg-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="100%" height="100%" id="observer-svg">
          <defs>
            <clipPath id="eyeScleraClip">
              <ellipse cx="480" cy="208" rx="160" ry="44" />
            </clipPath>
          </defs>

          <!-- Container Box -->
          <rect x="35" y="10" width="890" height="390" rx="6" class="box-rect" />

          <!-- Sub Header inside box -->
          <g class="mono">
            <circle cx="58" cy="35" r="3.5" class="status-dot-svg pulse-indicator" />
            <text x="70" y="39" class="sub-caption">SENTINEL // ASCII OCULAR ENTITY</text>
            <text x="890" y="39" class="link-hint" id="telemetry-live" text-anchor="end">FIELD: 360° · PUPIL: (0.0, 0.0)</text>
          </g>

          <!-- Eye Creature Group -->
          <g class="mono animated-breathing" xml:space="preserve" id="eye-body">
            <!-- Static Upper Orbit -->
            <g class="eye-frame">
              <text x="195" y="68" class="eye-frame">                     .-----------------------------------.                     </text>
      <text x="195" y="82" class="eye-frame">                .--''                                     ''--.                </text>
      <text x="195" y="96" class="eye-frame">            .-''        .-----------------------------.        ''-.            </text>
      <text x="195" y="110" class="eye-frame">         .-'         .-'                               '-.         '-.         </text>
      <text x="195" y="124" class="eye-frame">       .'          .'                                     '.          '.       </text>
      <text x="195" y="138" class="eye-frame">     .'           /                                         \           '.     </text>
      <text x="195" y="152" class="eye-frame">    /            /                                           \            \    </text>
      <text x="195" y="166" class="eye-frame">   ;            ;                                             ;            ;   </text>
            </g>

            <!-- Sclera Lateral Boundaries -->
            <g class="eye-frame">
              <text x="195" y="180" class="eye-frame">  |            |                                               |            |  </text>
      <text x="195" y="194" class="eye-frame">  |            |                                               |            |  </text>
      <text x="195" y="208" class="eye-frame">  |            |                                               |            |  </text>
      <text x="195" y="222" class="eye-frame">  |            |                                               |            |  </text>
      <text x="195" y="236" class="eye-frame">  |            |                                               |            |  </text>
            </g>

            <!-- Animated Pupil/Iris Traveling in Sclera -->
            <g clip-path="url(#eyeScleraClip)">
              <g id="pupil-tracker">
                <text x="195" y="166" class="pupil-iris">                                .-------.                                      </text>
      <text x="195" y="180" class="pupil-iris">                              .' ░▒▓▓▒░ '.                                     </text>
      <text x="195" y="194" class="pupil-iris">                             / ░▓█████▓░ \                                     </text>
      <text x="195" y="208" class="pupil-iris">                            | ▒▓██ <tspan class="pupil-core">●</tspan> ██▓▒ |                                    </text>
      <text x="195" y="222" class="pupil-iris">                             \ ░▓█████▓░ /                                     </text>
      <text x="195" y="236" class="pupil-iris">                              '. ░▒▓▓▒░ .'                                     </text>
      <text x="195" y="250" class="pupil-iris">                                '-------'                                      </text>
              </g>
            </g>

            <!-- Animated Eyelids (Blink) -->
            <g class="lid-top-group eye-lid" id="lid-top">
              <text x="195" y="194" class="eye-lid">  |------------|-----------------------------------------------|------------|  </text>
      <text x="195" y="208" class="eye-lid">   \          /                 .-------------.                 \          /   </text>
            </g>

            <g class="lid-bottom-group eye-lid" id="lid-bottom">
              <text x="195" y="208" class="eye-lid">   /          \                 '-------------'                 /          \   </text>
      <text x="195" y="222" class="eye-lid">  |------------|-----------------------------------------------|------------|  </text>
            </g>

            <!-- Static Lower Orbit -->
            <g class="eye-frame">
              <text x="195" y="250" class="eye-frame">   ;            ;                                             ;            ;   </text>
      <text x="195" y="264" class="eye-frame">    \            \                                           /            /    </text>
      <text x="195" y="278" class="eye-frame">     '.           \                                         /           .'     </text>
      <text x="195" y="292" class="eye-frame">       '.          '.                                     .'          .'       </text>
      <text x="195" y="306" class="eye-frame">         '-.         '-.                               .-'         .-'         </text>
      <text x="195" y="320" class="eye-frame">            '-..        '-----------------------------'        ..-'            </text>
      <text x="195" y="334" class="eye-frame">                '--..                                     ..--'                </text>
      <text x="195" y="348" class="eye-frame">                     '-----------------------------------'                     </text>
            </g>

            <!-- Telemetry Status Line -->
            <g class="eye-frame" text-anchor="middle">
              <text x="480" y="380"><tspan class="term-dim">--·[</tspan> <tspan class="pupil-core">✦</tspan> <tspan class="sub-caption">OCULAR CONDUIT :: RETINA CALIBRATED :: LIVE PRESENCE</tspan> <tspan class="pupil-core">✦</tspan> <tspan class="term-dim">]·--</tspan></text>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://github.com/themistrinel">← Return to GitHub Profile</a>
      <span style="color: var(--text-dark);">·</span>
      <a href="https://github.com/themistrinel/themistrinel">View Repository</a>
      <span style="color: var(--text-dark);">·</span>
      <span id="microsaccade-indicator" style="color: var(--text-dark);">MICROSACCADES: ON</span>
    </div>
    <div class="instructions">
      Move cursor across the screen or drag on touch devices to guide the entity's gaze. Leave the window or rest to observe natural centering &amp; blinking.
    </div>
  </footer>

  <script>
    (function () {
      // Configuration & Physics in SVG viewBox units
      const CONFIG = {
        lerpFactor: 0.08,         // Smooth inertia (0.05 = heavy, 0.08 = natural, 0.12 = fast)
        maxRadiusX: 42,           // Max horizontal pupil displacement in SVG viewBox units
        maxRadiusY: 14,           // Max vertical pupil displacement in SVG viewBox units
        idleTimeoutMs: 3500,      // Inactivity timeout before resting
        blinkMinInterval: 3500,   // Min time between organic blinks (ms)
        blinkMaxInterval: 7000,   // Max time between organic blinks (ms)
        saccadeMinInterval: 1800, // Microsaccade interval
        saccadeMaxInterval: 4200
      };

      // State variables
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let isInside = true;
      let lastMoveTime = performance.now();

      // Current physics coordinates (SVG units)
      let currentX = 0;
      let currentY = 0;
      let targetX = 0;
      let targetY = 0;

      // Micro-saccade offset (simulates living ocular fixation)
      let saccadeX = 0;
      let saccadeY = 0;

      // Blinking state
      let isBlinking = false;
      let nextBlinkTime = performance.now() + 2500;
      let nextSaccadeTime = performance.now() + 1800;

      // Elements
      const observerSvg = document.getElementById('observer-svg');
      const pupilTracker = document.getElementById('pupil-tracker');
      const labelState = document.getElementById('label-state');
      const telemetryLive = document.getElementById('telemetry-live');
      const themeToggle = document.getElementById('theme-toggle');

      // Theme toggle
      themeToggle.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', nextTheme);
      });

      // Pointer event listeners (desktop mouse + mobile touch)
      function handlePointerMove(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        isInside = true;
        lastMoveTime = performance.now();
      }

      window.addEventListener('pointermove', handlePointerMove, { passive: true });
      window.addEventListener('pointerdown', handlePointerMove, { passive: true });

      // Leave window -> return to neutral
      document.addEventListener('pointerleave', () => {
        isInside = false;
      });

      window.addEventListener('blur', () => {
        isInside = false;
      });

      // Periodic natural blink trigger
      function triggerBlink() {
        if (isBlinking) return;
        isBlinking = true;
        observerSvg.classList.add('is-blinking');
        labelState.textContent = 'BLINK';

        // Organic blink duration: close fast (~85ms), open smoothly (~140ms)
        setTimeout(() => {
          observerSvg.classList.remove('is-blinking');
          setTimeout(() => {
            isBlinking = false;
            labelState.textContent = isInside ? 'TRACKING' : 'NEUTRAL';
          }, 140);
        }, 90);

        // Schedule next blink
        nextBlinkTime = performance.now() + CONFIG.blinkMinInterval + Math.random() * (CONFIG.blinkMaxInterval - CONFIG.blinkMinInterval);
      }

      // Micro-saccade trigger
      function triggerSaccade() {
        const angle = Math.random() * Math.PI * 2;
        const mag = 1.0 + Math.random() * 1.8;
        saccadeX = Math.cos(angle) * mag;
        saccadeY = Math.sin(angle) * (mag * 0.35);

        nextSaccadeTime = performance.now() + CONFIG.saccadeMinInterval + Math.random() * (CONFIG.saccadeMaxInterval - CONFIG.saccadeMinInterval);
      }

      // Main Animation Loop (60-120fps via requestAnimationFrame)
      function renderLoop(now) {
        const rect = observerSvg.getBoundingClientRect();
        // The eye center is at (480, 208) in viewBox (0 0 960 410)
        const eyeScreenCenterX = rect.left + rect.width * (480 / 960);
        const eyeScreenCenterY = rect.top + rect.height * (208 / 410);

        const isIdle = (now - lastMoveTime) > CONFIG.idleTimeoutMs;

        // Destination target based on cursor state
        if (!isInside || isIdle) {
          targetX = 0;
          targetY = 0;
          if (labelState.textContent !== 'BLINK') {
            labelState.textContent = isInside ? 'IDLE / NEUTRAL' : 'OUT OF BOUNDS';
          }
        } else {
          if (labelState.textContent !== 'BLINK') {
            labelState.textContent = 'TRACKING';
          }

          // Vector from eye center to cursor in screen pixels
          const rawDx = mouseX - eyeScreenCenterX;
          const rawDy = mouseY - eyeScreenCenterY;

          // Normalize vector relative to screen dimensions
          const screenHalfW = window.innerWidth / 2;
          const screenHalfH = window.innerHeight / 2;

          const normX = Math.max(-1, Math.min(1, rawDx / screenHalfW));
          const normY = Math.max(-1, Math.min(1, rawDy / screenHalfH));

          let mappedX = normX * CONFIG.maxRadiusX;
          let mappedY = normY * CONFIG.maxRadiusY;

          // Strict Anatomical Ellipse Clamping:
          // (mappedX / maxRadiusX)^2 + (mappedY / maxRadiusY)^2 <= 1.0
          const distSq = (mappedX / CONFIG.maxRadiusX) ** 2 + (mappedY / CONFIG.maxRadiusY) ** 2;
          if (distSq > 1.0) {
            const angle = Math.atan2(mappedY / CONFIG.maxRadiusY, mappedX / CONFIG.maxRadiusX);
            mappedX = Math.cos(angle) * CONFIG.maxRadiusX;
            mappedY = Math.sin(angle) * CONFIG.maxRadiusY;
          }

          targetX = mappedX;
          targetY = mappedY;
        }

        // Microsaccade decay
        saccadeX *= 0.90;
        saccadeY *= 0.90;

        // Spontaneous biological triggers
        if (now > nextBlinkTime) {
          triggerBlink();
        }
        if (now > nextSaccadeTime && !isBlinking) {
          triggerSaccade();
        }

        // Smooth Interpolation (Lerp)
        currentX += (targetX + saccadeX - currentX) * CONFIG.lerpFactor;
        currentY += (targetY + saccadeY - currentY) * CONFIG.lerpFactor;

        // Apply transform to pupil tracker group in SVG
        pupilTracker.setAttribute('transform', `translate(${currentX.toFixed(2)}, ${currentY.toFixed(2)})`);

        // Update telemetry display
        telemetryLive.textContent = `FIELD: 360° · PUPIL: (${currentX > 0 ? '+' : ''}${currentX.toFixed(1)}, ${currentY > 0 ? '+' : ''}${currentY.toFixed(1)})`;

        requestAnimationFrame(renderLoop);
      }

      // Start loop
      requestAnimationFrame(renderLoop);
    })();
  </script>
</body>
</html>
