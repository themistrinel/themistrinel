<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre;
      }

      /* Cores Dark Mode (Padrão) */
      .text-title { font-size: 24px; font-weight: 600; fill: #f0f6fc; letter-spacing: 3px; }
      .text-sub { font-size: 13px; fill: #8b949e; letter-spacing: 1px; }
      .text-hero { font-size: 13.5px; fill: #c9d1d9; }
      .sec-head { font-size: 15px; font-weight: 600; fill: #f0f6fc; letter-spacing: 0.5px; }
      .sec-arrow { fill: #58a6ff; font-weight: 600; }
      .body-text { font-size: 13px; fill: #8b949e; }
      .highlight { fill: #58a6ff; }
      .term-dim { fill: #484f58; }
      .box-text { font-size: 12.5px; fill: #c9d1d9; }
      .proj-title { font-size: 14.5px; font-weight: 600; fill: #58a6ff; }
      .proj-desc { font-size: 12.5px; fill: #8b949e; }
      .conn-label { font-size: 13px; fill: #c9d1d9; }
      .conn-link { font-size: 13px; fill: #58a6ff; }
      .quote-text { font-size: 14px; fill: #8b949e; }
      .divider { stroke: #21262d; stroke-width: 1; }
      .box-rect { fill: #161b22; fill-opacity: 0.5; stroke: #30363d; stroke-width: 1; }
      .vert-div { stroke: #21262d; stroke-width: 1; }
      .ascii-art { fill: #c9d1d9; }
      .icon-fill { fill: #8b949e; }
      .folder-stroke { stroke: #58a6ff; stroke-width: 1.5; }

      /* Suporte automático ao Light Mode caso o usuário use GitHub claro */
      @media (prefers-color-scheme: light) {
        .text-title { fill: #1f2328; }
        .text-sub { fill: #656d76; }
        .text-hero { fill: #24292f; }
        .sec-head { fill: #1f2328; }
        .sec-arrow { fill: #0969da; }
        .body-text { fill: #57606a; }
        .highlight { fill: #0969da; }
        .term-dim { fill: #8c959f; }
        .box-text { fill: #24292f; }
        .proj-title { fill: #0969da; }
        .proj-desc { fill: #57606a; }
        .conn-label { fill: #24292f; }
        .conn-link { fill: #0969da; }
        .quote-text { fill: #57606a; }
        .divider { stroke: #d0d7de; }
        .box-rect { fill: #f6f8fa; fill-opacity: 0.8; stroke: #d0d7de; }
        .vert-div { stroke: #d0d7de; }
        .ascii-art { fill: #24292f; }
        .icon-fill { fill: #57606a; }
        .folder-stroke { stroke: #0969da; }
      }
    </style>
  </defs>

  <!-- Fundo 100% Transparente: Sem <rect> de fundo -->

  <!-- ================= TOP HERO SECTION ================= -->
  <!-- ASCII Art Left -->
  <g class="mono ascii-art" font-size="11.5" xml:space="preserve">
    <text x="35" y="52">             -      .-------.     .-------.   -</text>
    <text x="35" y="65.5">          ---     .'         `.   `-------'     -</text>
    <text x="35" y="79.0">       --        /             \        -------</text>
    <text x="35" y="92.5">      -   _.-   :               :    ----</text>
    <text x="35" y="106.0">  _.-  _.-      |               |   .------.</text>
    <text x="35" y="119.5">         /\     :               :   `------'  -</text>
    <text x="35" y="133.0">        /  \     \             /        --</text>
    <text x="35" y="146.5">       /    \     `.         .'     ---</text>
    <text x="35" y="160.0">      /  /\  \      `-------'  _  --</text>
    <text x="35" y="173.5">     /  /  \  \    /\        / \       -------------  ----</text>
    <text x="35" y="187.0"> ---'--'    \  \  /  \      /   \     /             \ ----</text>
    <text x="35" y="200.5"> -------------------------------------------------------</text>
    <text x="35" y="214.0">   ------   ----------     -------      ------    ----</text>
    <text x="35" y="227.5">      -------     ---------    ----        ---</text>
    <text x="35" y="241.0">          ------      ----         ---</text>
  </g>

  <!-- Hero Right Text -->
  <g class="mono">
    <text x="510" y="85" class="text-title">themistrinel</text>
    <text x="510" y="118" class="text-sub">systems <tspan class="term-dim"> / </tspan> software <tspan class="term-dim"> / </tspan> experiments</text>

    <text x="510" y="170" class="text-hero">Building low-level systems,</text>
    <text x="510" y="195" class="text-hero">exploring new technologies,</text>
    <text x="510" y="220" class="text-hero">and turning ideas into software.</text>
  </g>

  <!-- Divider 1 -->
  <line x1="35" y1="280" x2="925" y2="280" class="divider" />

  <!-- ================= ABOUT & FOCUS ================= -->
  <!-- About Left -->
  <g class="mono">
    <text x="35" y="318" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> about</text>
    <text x="50" y="352" class="body-text">I'm João Vitor, a developer focused on</text>
    <text x="50" y="374" class="body-text">systems, low-level software and game engines.</text>
    <text x="50" y="396" class="body-text">I enjoy building fast, efficient and</text>
    <text x="50" y="418" class="body-text">well-structured systems, and I'm always</text>
    <text x="50" y="440" class="body-text">exploring new tools, techniques and ideas.</text>

    <text x="50" y="478" class="body-text">
      <tspan class="highlight">Brazil</tspan>   <tspan class="term-dim">/</tspan>   <tspan class="highlight">23</tspan>
    </text>
  </g>

  <!-- Vertical Divider Between About & Focus -->
  <line x1="465" y1="330" x2="465" y2="480" class="vert-div" />

  <!-- Focus Right -->
  <g class="mono">
    <text x="490" y="318" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> focus</text>

    <!-- item 1 -->
    <text x="500" y="362" class="body-text" font-weight="600">—</text>
    <text x="525" y="362" class="body-text" font-weight="600">systems</text>
    <text x="635" y="362" class="body-text">low-level software <tspan class="term-dim">·</tspan> runtimes <tspan class="term-dim">·</tspan> architecture</text>

    <!-- item 2 -->
    <text x="500" y="400" class="body-text" font-weight="600">—</text>
    <text x="525" y="400" class="body-text" font-weight="600">graphics</text>
    <text x="635" y="400" class="body-text">rendering <tspan class="term-dim">·</tspan> engines <tspan class="term-dim">·</tspan> real-time systems</text>

    <!-- item 3 -->
    <text x="500" y="438" class="body-text" font-weight="600">—</text>
    <text x="525" y="438" class="body-text" font-weight="600">development</text>
    <text x="635" y="438" class="body-text">full-stack <tspan class="term-dim">·</tspan> tooling <tspan class="term-dim">·</tspan> infrastructure</text>
  </g>

  <!-- Divider 2 -->
  <line x1="35" y1="505" x2="925" y2="505" class="divider" />

  <!-- ================= STACK ================= -->
  <g class="mono">
    <text x="35" y="540" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> stack</text>

    <!-- Box 1 -->
    <rect x="35" y="560" width="235" height="34" rx="5" class="box-rect" />
    <text x="48" y="582" class="box-text">C  <tspan class="term-dim">/</tspan>  C++  <tspan class="term-dim">/</tspan>  Go  <tspan class="term-dim">/</tspan>  TypeScript</text>

    <!-- Box 2 -->
    <rect x="290" y="560" width="325" height="34" rx="5" class="box-rect" />
    <text x="303" y="582" class="box-text">Linux  <tspan class="term-dim">/</tspan>  POSIX  <tspan class="term-dim">/</tspan>  ECS  <tspan class="term-dim">/</tspan>  Rendering  <tspan class="term-dim">/</tspan>  Runtime</text>

    <!-- Box 3 -->
    <rect x="635" y="560" width="290" height="34" rx="5" class="box-rect" />
    <text x="648" y="582" class="box-text">CMake  <tspan class="term-dim">/</tspan>  GDB  <tspan class="term-dim">/</tspan>  Neovim  <tspan class="term-dim">/</tspan>  Docker  <tspan class="term-dim">/</tspan>  SQL</text>
  </g>

  <!-- Divider 3 -->
  <line x1="35" y1="615" x2="925" y2="615" class="divider" />

  <!-- ================= PROJECTS ================= -->
  <g class="mono">
    <text x="35" y="650" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> projects</text>

    <!-- Project 1 -->
    <g transform="translate(35, 672)">
      <path d="M0 2a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2z" fill="none" class="folder-stroke" />
      <text x="26" y="11" class="proj-title">desktop_video_macos</text>
      <text x="26" y="32" class="proj-desc">Native macOS live wallpaper app with menubar controls.</text>
      <line x1="0" y1="46" x2="410" y2="46" class="divider" />
    </g>

    <!-- Project 2 -->
    <g transform="translate(490, 672)">
      <path d="M0 2a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2z" fill="none" class="folder-stroke" />
      <text x="26" y="11" class="proj-title">omnicmd</text>
      <text x="26" y="32" class="proj-desc">Desktop command palette and productivity accelerator.</text>
      <line x1="0" y1="46" x2="435" y2="46" class="divider" />
    </g>
  </g>

  <!-- Divider 4 -->
  <line x1="35" y1="740" x2="925" y2="740" class="divider" />

  <!-- ================= CONNECT & QUOTE ================= -->
