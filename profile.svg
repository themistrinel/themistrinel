  <!-- About Left -->
  <g class="mono">
    <text x="35" y="352" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> about</text>
    <text x="50" y="388" class="body-text">I'm João Vitor, a developer focused on</text>
    <text x="50" y="410" class="body-text">systems, low-level software and game engines.</text>
    <text x="50" y="432" class="body-text">I enjoy building fast, efficient and</text>
    <text x="50" y="454" class="body-text">well-structured systems, and I'm always</text>
    <text x="50" y="476" class="body-text">exploring new tools, techniques and ideas.</text>

    <text x="50" y="515" class="body-text">
      <tspan class="highlight">Brazil</tspan>   <tspan class="term-dim">/</tspan>   <tspan class="highlight">23</tspan>
    </text>
  </g>

  <!-- Vertical Divider Between About & Focus -->
