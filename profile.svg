    <g transform="translate(475, 715)">
      <path d="M0 2a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2z" fill="none" stroke="#58a6ff" stroke-width="1.5" />
      <text x="26" y="11" class="proj-title">engine_runtime</text>
