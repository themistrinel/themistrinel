  <!-- Hero Right Text -->
  <g class="mono">
    <text x="500" y="105" class="text-title">themistrinel</text>
    <text x="500" y="140" class="text-sub">systems <tspan class="term-dim"> / </tspan> software <tspan class="term-dim"> / </tspan> experiments</text>

    <text x="500" y="195" class="text-hero">Building low-level systems,</text>
    <text x="500" y="220" class="text-hero">exploring new technologies,</text>
    <text x="500" y="245" class="text-hero">and turning ideas into software.</text>
  </g>

