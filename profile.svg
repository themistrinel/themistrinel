        <path d="M11.02 0h2.15L8.47 5.37 14 12.7H9.68L6.29 8.28 2.42 12.7H.26l5.03-5.75L0 0h4.43l3.06 4.05L11.02 0zm-.75 11.4h1.19L3.79 1.24H2.52l7.75 10.16z" fill="#8b949e" />
        <text x="28" y="11" class="conn-label">x</text>
        <text x="125" y="11" class="conn-link">x.com/themistrinel</text>
