    <text x="47" y="620" class="box-text">C  <tspan class="term-dim">/</tspan>  C++  <tspan class="term-dim">/</tspan>  Go  <tspan class="term-dim">/</tspan>  TypeScript</text>

    <!-- Box 2 -->
    <rect x="280" y="598" width="315" height="34" rx="5" fill="#161b22" fill-opacity="0.6" stroke="#30363d" stroke-width="1" />
    <text x="292" y="620" class="box-text">Linux  <tspan class="term-dim">/</tspan>  POSIX  <tspan class="term-dim">/</tspan>  ECS  <tspan class="term-dim">/</tspan>  Rendering  <tspan class="term-dim">/</tspan>  Runtime</text>

    <!-- Box 3 -->
    <rect x="615" y="598" width="270" height="34" rx="5" fill="#161b22" fill-opacity="0.6" stroke="#30363d" stroke-width="1" />
