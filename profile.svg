  <g class="mono" font-size="11.5" fill="#c9d1d9" xml:space="preserve">
    <text x="35" y="65">             -      .-------.     .-------.   -</text>
    <text x="35" y="81">          ---     .'         `.   `-------'     -</text>
    <text x="35" y="97">       --        /             \        -------</text>
    <text x="35" y="113">      -   _.-   :               :    ----</text>
    <text x="35" y="129">  _.-  _.-      |               |   .------.</text>
    <text x="35" y="145">         /\     :               :   `------'  -</text>
    <text x="35" y="161">        /  \     \             /        --</text>
    <text x="35" y="177">       /    \     `.         .'     ---</text>
    <text x="35" y="193">      /  /\  \      `-------'  _  --</text>
    <text x="35" y="209">     /  /  \  \    /\        / \       -------------  ----</text>
    <text x="35" y="225"> ---'--'    \  \  /  \      /   \     /             \ ----</text>
    <text x="35" y="241"> -------------------------------------------------------</text>
    <text x="35" y="257">   ------   ----------     -------      ------    ----</text>
    <text x="35" y="273">      -------     ---------    ----        ---</text>
    <text x="35" y="289">          ------      ----         ---</text>
