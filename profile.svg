    <text x="35" y="775" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> connect</text>

    <!-- Connect Links Left -->
    <g transform="translate(35, 795)">
      <!-- GitHub -->
      <g transform="translate(0, 5)">
        <path d="M7 0C3.13 0 0 3.18 0 7.1c0 3.14 2 5.8 4.78 6.74.35.07.48-.15.48-.34v-1.22c-1.95.43-2.36-.95-2.36-.95-.32-.82-.78-1.04-.78-1.04-.64-.44.05-.43.05-.43.7.05 1.08.73 1.08.73.62 1.1 1.64.78 2.04.6.06-.47.25-.78.45-.96-1.55-.18-3.19-.79-3.19-3.52 0-.78.27-1.42.72-1.92-.08-.18-.31-.9.07-1.89 0 0 .59-.19 1.93.73A6.6 6.6 0 0 1 7 3.93c.6 0 1.2.08 1.77.24 1.34-.92 1.93-.73 1.93-.73.38.99.15 1.71.07 1.89.45.5.72 1.14.72 1.92 0 2.74-1.64 3.34-3.2 3.52.26.23.48.67.48 1.35v2c0 .2.13.42.49.34A7.12 7.12 0 0 0 14 7.1C14 3.18 10.87 0 7 0z" class="icon-fill" />
        <text x="28" y="11" class="conn-label">github</text>
        <text x="125" y="11" class="conn-link">github.com/themistrinel</text>
      </g>

      <!-- LinkedIn -->
      <g transform="translate(0, 31)">
        <path d="M12.5 0h-11A1.5 1.5 0 0 0 0 1.5v11A1.5 1.5 0 0 0 1.5 14h11a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 12.5 0zM4.15 11.85H2.1V5.2h2.05v6.65zM3.12 4.3a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4zm8.73 7.55h-2.05V8.63c0-.77-.02-1.76-1.07-1.76-1.07 0-1.24.84-1.24 1.71v3.27H5.44V5.2h1.97v.91h.03c.27-.52.94-1.07 1.94-1.07 2.08 0 2.47 1.37 2.47 3.15v3.66z" class="icon-fill" />
        <text x="28" y="11" class="conn-label">linkedin</text>
        <text x="125" y="11" class="conn-link">linkedin.com/in/joaovitordinizmistrinel</text>
      </g>

      <!-- X -->
      <g transform="translate(0, 57)">
        <path d="M11.02 0h2.15L8.47 5.37 14 12.7H9.68L6.29 8.28 2.42 12.7H.26l5.03-5.75L0 0h4.43l3.06 4.05L11.02 0zm-.75 11.4h1.19L3.79 1.24H2.52l7.75 10.16z" class="icon-fill" />
        <text x="28" y="11" class="conn-label">x</text>
        <text x="125" y="11" class="conn-link">x.com/themistrinel</text>
      </g>

      <!-- Email -->
      <g transform="translate(0, 83)">
        <path d="M0 2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm2-.5a.5.5 0 0 0-.5.5v.22l5.5 3.3 5.5-3.3V2a.5.5 0 0 0-.5-.5H2zm10.5 2.03L7.26 6.7a.5.5 0 0 1-.52 0L1.5 3.53V10a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5V3.53z" class="icon-fill" />
        <text x="28" y="11" class="conn-label">email</text>
        <text x="125" y="11" class="conn-link">themistrinel@gmail.com</text>
      </g>
    </g>

    <!-- Vertical Divider Between Connect & Quote -->
    <line x1="680" y1="800" x2="680" y2="890" class="vert-div" />

    <!-- Quote Right -->
    <g transform="translate(705, 800)">
      <text x="0" y="25" class="quote-text">“ Better tools,</text>
      <text x="20" y="48" class="quote-text">better systems. ”</text>

      <text x="0" y="85" class="body-text" font-weight="600" fill="#58a6ff">&gt;  _</text>
    </g>
  </g>

</svg>