    <text x="510" y="400" class="body-text" fill="#f0f6fc" font-weight="600">systems</text>
    <text x="615" y="400" class="body-text">low-level software <tspan class="term-dim">·</tspan> runtimes <tspan class="term-dim">·</tspan> architecture</text>

    <!-- item 2 -->
    <text x="485" y="438" class="body-text" fill="#f0f6fc">—</text>
    <text x="510" y="438" class="body-text" fill="#f0f6fc" font-weight="600">graphics</text>
    <text x="615" y="438" class="body-text">rendering <tspan class="term-dim">·</tspan> engines <tspan class="term-dim">·</tspan> real-time systems</text>

    <!-- item 3 -->
    <text x="485" y="476" class="body-text" fill="#f0f6fc">—</text>
    <text x="510" y="476" class="body-text" fill="#f0f6fc" font-weight="600">development</text>
    <text x="615" y="476" class="body-text">full-stack <tspan class="term-dim">·</tspan> tooling <tspan class="term-dim">·</tspan> infrastructure</text>
  </g>

