<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 960" width="100%" height="100%">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        white-space: pre;
      }
      .text-title {
        font-size: 24px;
        font-weight: 600;
        fill: #f0f6fc;
        letter-spacing: 3px;
      }
      .text-sub {
        font-size: 13px;
        fill: #8b949e;
        letter-spacing: 1px;
      }
      .text-hero {
        font-size: 14px;
        fill: #c9d1d9;
        line-height: 23px;
      }
      .sec-head {
        font-size: 15px;
        font-weight: 600;
        fill: #f0f6fc;
        letter-spacing: 0.5px;
      }
      .sec-arrow {
        fill: #58a6ff;
        font-weight: 600;
      }
      .body-text {
        font-size: 13.5px;
        fill: #8b949e;
        line-height: 21px;
      }
      .highlight {
        fill: #58a6ff;
      }
      .term-dim {
        fill: #484f58;
      }
      .box-text {
        font-size: 12.5px;
        fill: #c9d1d9;
      }
      .proj-title {
        font-size: 14.5px;
        font-weight: 600;
        fill: #58a6ff;
      }
      .proj-desc {
        font-size: 12.5px;
        fill: #8b949e;
      }
      .conn-label {
        font-size: 13.5px;
        fill: #c9d1d9;
      }
      .conn-link {
        font-size: 13.5px;
        fill: #58a6ff;
      }
      .quote-text {
        font-size: 14px;
        fill: #8b949e;
      }
