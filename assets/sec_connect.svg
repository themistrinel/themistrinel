<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 45" width="100%" height="100%">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .sec-head { font-size: 15px; font-weight: 600; fill: #f0f6fc; letter-spacing: 0.5px; }
      .sec-arrow { fill: #58a6ff; font-weight: 600; }
      .divider { stroke: #21262d; stroke-width: 1; }
      @media (prefers-color-scheme: light) {
        .sec-head { fill: #1f2328; }
        .sec-arrow { fill: #0969da; }
        .divider { stroke: #d0d7de; }
      }
    </style>
  </defs>
  <line x1="35" y1="5" x2="925" y2="5" class="divider" />
  <g class="mono">
    <text x="35" y="34" class="sec-head"><tspan class="sec-arrow">&gt;</tspan> connect</text>
  </g>
</svg>